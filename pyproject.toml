[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "online-agent"
version = "0.1.0"
description = "An advanced, web-connected agent built on the Claude API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
online-agent = "online_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/online_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
